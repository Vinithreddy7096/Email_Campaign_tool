{% load static %}<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{# Fonts from the design (docs/design/console-mockup.html). Every family has a #}
{# system fallback, so the console works offline; self-host to avoid Google.   #}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Schibsted+Grotesk:wght@600;700&display=swap">
{# Apply a saved light/dark choice before first paint (no flash). #}
<script>try { var t = localStorage.getItem('ep-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="{% static 'console/tokens.css' %}">
<link rel="stylesheet" href="{% static 'console/console.css' %}">
