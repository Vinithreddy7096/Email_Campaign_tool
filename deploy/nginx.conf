# Reverse proxy on each app node: TLS termination in front of gunicorn
# (127.0.0.1:8000). Install as /etc/nginx/conf.d/email-platform.conf.
#
# Replace console.example.com and the certificate paths. The console, admin and
# API are restricted to the operator networks below; only /u/ (unsubscribe —
# it is in every email) and the signed webhook endpoints are public.

upstream email_platform {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Operator / office / VPN networks allowed to reach the console and API.
geo $operator_net {
    default        0;
    10.0.0.0/8     1;
    # 203.0.113.0/24 1;   # office
}

server {
    listen 80;
    listen [::]:80;
    server_name console.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name console.example.com;

    ssl_certificate     /etc/letsencrypt/live/console.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 3m;   # bounces ≤ 2.5 MB; API bodies are far smaller
    client_body_timeout 15s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Always overwrite what the client sent: Django trusts these headers.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 35s;

    # Public: unsubscribe links in every email (must work for anyone).
    location /u/ {
        limit_except GET POST { deny all; }
        proxy_pass http://email_platform;
    }

    # Public but signed (HMAC): provider webhooks. MTA intake is private — the
    # MTA hosts post over the internal network, or add their IPs here.
    location = /api/v1/events/provider { proxy_pass http://email_platform; }
    location ~ ^/api/v1/events/(mail|postfix-log)$ {
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://email_platform;
    }

    # Contact import upload: CONTACT_IMPORT_MAX_BYTES (10 MB) plus form overhead.
    location = /contacts/import/ {
        client_max_body_size 11m;
        client_body_timeout 60s;
        proxy_pass http://email_platform;
    }

    # Probes and metrics are for the private network only.
    location ~ ^/(health/|metrics$) {
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://email_platform;
    }

    # Static files are served by WhiteNoise with far-future cache headers.
    location /static/ {
        proxy_pass http://email_platform;
    }

    # Everything else — console, admin, API — operators only.
    location / {
        if ($operator_net = 0) { return 403; }
        proxy_pass http://email_platform;
    }
}
