[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The application runs from source via PYTHONPATH (see Dockerfile), not as an
# installed package. This project table exists to resolve dependencies only.
[tool.setuptools]
packages = []

[project]
name = "email-platform"
version = "0.1.0"
description = "Turnkey high-volume permission-based email infrastructure"
requires-python = ">=3.11"

dependencies = [
    "Django>=5.1,<5.2",        # CheckConstraint(condition=…) is 5.1+
    "djangorestframework>=3.15",
    "django-environ>=0.11",
    "psycopg[binary]>=3.1",
    "celery>=5.3,<6",
    "kombu>=5.3",
    "redis>=5.0",
    "Jinja2>=3.1",             # sandboxed rendering, §8.7
    "idna>=3.6",               # punycode normalization, §8.1
    "boto3>=1.34",             # S3 / MinIO
    "django-htmx>=1.17",
    "gunicorn>=21.2",
    "whitenoise>=6.6",         # serves /static/ (console + admin CSS)
    "structlog>=24.1",
    "python-json-logger>=2.0",
    "django-prometheus>=2.3",
    "dnspython>=2.6",          # scripts/validate_dns.py
    "cryptography>=42.0",      # VERP HMAC tokens, field encryption
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "django-stubs>=5.0",
    "django-extensions>=3.2",  # shell_plus
    "factory-boy>=3.3",
    "freezegun>=1.4",
    "PyYAML>=6.0",             # tests/fixtures/dns_responses.yml
]

# ─── Ruff ────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "DJ", "C4", "RET", "SIM"]
ignore = [
    "S101",  # assert — the §4.2 boot guards are deliberate assertions
    "E501",  # line length handled by the formatter
]

[tool.ruff.lint.isort]
# Everything under app/ is a top-level package on PYTHONPATH, so isort cannot
# infer these. Without it, project imports get sorted in with third-party ones.
known-first-party = [
    "config", "common", "accounts", "domains", "contacts", "consent",
    "suppression", "email_templates", "campaigns", "delivery", "events",
    "audit", "api", "console", "ui", "workers", "tests",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # hardcoded test credentials are fine in tests
"email_templates/tests/**" = ["S105", "S106"]

# ─── mypy ────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
# app/ holds top-level packages (config, common, accounts, …) that are put on
# PYTHONPATH at runtime. The django-stubs plugin imports the settings module
# itself, so it needs the same path or it cannot bootstrap Django.
mypy_path = ["app", "."]
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.local"

# ─── pytest ──────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py"]
pythonpath = [".", "app"]
testpaths = ["tests", "email_templates/tests"]
addopts = "--strict-markers"
markers = [
    "integration: requires postgres/rabbitmq/redis to be running",
    "e2e: full pipeline through the MailHog sink",
]

[tool.coverage.run]
source = ["app", "workers", "email_templates"]
omit = ["*/migrations/*", "*/tests/*", "*/config/settings/*"]
